name: Checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: megan
          POSTGRES_PASSWORD: megan
          POSTGRES_DB: megan_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U megan -d megan_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://megan:megan@127.0.0.1:5432/megan_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: ruff check backend tests scripts && ruff format --check backend tests scripts
      - run: pytest -q
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - run: python scripts/export_schema.py && npm --prefix frontend run generate:types
      - run: git diff --exit-code -- frontend/src/generated/schema.ts
