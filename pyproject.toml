[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "megan-meeting-intelligence"
version = "0.1.0"
description = "Local, evidence-linked meeting reports"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "ruff>=0.11,<1"]
cuda = [
  "faster-whisper>=1.1,<2",
  "nvidia-cublas-cu12>=12,<13; platform_system == 'Linux'",
  "nvidia-cudnn-cu12>=9,<10; platform_system == 'Linux'",
]
setup = ["huggingface-hub>=0.30,<2"]

[project.scripts]
megan = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires a local PostgreSQL test database", "models: requires actual local model weights"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
